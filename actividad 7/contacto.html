<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="recursos/estilos/index.css">
    <link rel="icon" type="image/jpeg" href="recursos/imagenes/engranaje.png">
</head>

<body>

    <header class="encabezado-principal">

        <a href="index.html">
            <img src="recursos/imagenes/logo.jpg.jpg" alt="Logo Taller" width="120">
        </a>

        <nav>

            <a href="index.html" class="boton">Inicio</a>
            <a href="contacto.html" class="botton">Contacto</a>

        </nav>

    </header>

    <main class="contenido-principal">

        <h1>Contacto</h1>

        <section>

            <h2>Solicitá un presupuesto</h2>

            <form action="./contacto.html" method="post">

                <p>Nombre completo</p>
                <input type="text" name="nombre">

                <p>Correo electrónico</p>
                <input type="email" name="email">

                <p>Teléfono</p>
                <input type="text" name="telefono">

                <p>Vehículo</p>
                <input type="text" name="vehiculo">

                <p>Describa el problema</p>
                <textarea name="consulta"></textarea>

                <br>

                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>

    <footer class="pie-principal">

        <ul>

            <li>
                <a href="https://instagram.com/tallerrapido" target="_blank">
                    @tallerrapido
                </a>
            </li>

            <li>
                Av. Siempre Viva 123 - Córdoba Capital
            </li>

        </ul>

    </footer>

    <a class="boton-whatsapp" href="https://api.whatsapp.com/send?text=Hola%2C%20quiero%20hacer%20una%20consulta">WhatsApp</a>

</body>

</html>
